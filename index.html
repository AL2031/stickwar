<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Player</title>
    <style>
        /* This makes the player fill the entire browser window */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #000; 
        }
        #ruffle-container { 
            width: 100vw; 
            height: 100vh; 
        }
    </style>
</head>
<body>

    <div id="ruffle-container"></div>

    <script src="ruffle.js"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            container.appendChild(player);
            
            player.load({
                url: "Stick_War_1.swf",
                backgroundColor: "#000000",
                letterbox: "on", // Keeps original aspect ratio
                scale: "showAll" // Fits the game to the screen
            });

            // Optional: Force the player to take up all available space
            player.style.width = "100%";
            player.style.height = "100%";
        });
    </script>

</body>
</html>
